<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password — GioAviation.aero</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/img/favicon-16.png" sizes="16x16">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<meta name="theme-color" content="#071A2E">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="GioAviation.aero — home">
      <img src="assets/img/logo-mark-dark.svg" alt="" width="40" height="40">
      <span class="name">GioAviation<b>.aero</b></span>
    </a>
    <nav class="primary">
      <a href="login.html">Log in</a>
    </nav>
  </div>
</header>

<main>
  <section class="cred-hero" style="padding-bottom:0;">
    <div class="wrap" style="max-width:440px;">
      <span class="eyebrow kicker">Approved pilots</span>
      <h1>Set your password.</h1>
      <p style="margin-top:16px; font-size:1.0625rem; color:var(--ink-soft);">Choose a password for future logins. At least 8 characters.</p>
    </div>
  </section>

  <section id="form-section">
    <div class="wrap" style="max-width:440px;">
      <div id="form-status" class="form-status" role="status"></div>
      <form id="activate-form" style="display:flex; flex-direction:column; gap:16px;">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn" style="align-self:flex-start;">Set password and continue</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="logo-fine">
      <a class="logo" href="index.html" aria-label="GioAviation.aero — home"><img src="assets/img/logo-mark-dark.svg" alt="" width="28" height="28"><span class="name">GioAviation<b>.aero</b></span></a>
      <span class="fine">© 2026 GioAviation.aero</span>
    </div>
  </div>
</footer>

<script>
(function(){
  var form = document.getElementById('activate-form');
  var status = document.getElementById('form-status');
  var token = new URLSearchParams(location.search).get('token');

  if (!token){
    form.hidden = true;
    status.className = 'form-status err';
    status.textContent = 'This link is missing its activation code. Please use the link from your approval email.';
    return;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = document.getElementById('password').value;
    var p2 = document.getElementById('password2').value;
    status.className = 'form-status';
    status.textContent = '';

    if (p1.length < 8){
      status.className = 'form-status err';
      status.textContent = 'Password must be at least 8 characters.';
      return;
    }
    if (p1 !== p2){
      status.className = 'form-status err';
      status.textContent = 'The two passwords do not match.';
      return;
    }

    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;

    fetch('/api/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: p1 })
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(r){
        if (r.ok && r.data.ok){
          window.location.href = 'profilo.html';
          return;
        }
        btn.disabled = false;
        status.className = 'form-status err';
        status.textContent = (r.data && r.data.error === 'expired_token')
          ? 'This activation link has expired. Ask the admin to resend it.'
          : (r.data && r.data.error === 'invalid_token')
            ? 'This activation link is not valid — it may have already been used.'
            : 'Could not set your password — please try again.';
      })
      .catch(function(){
        btn.disabled = false;
        status.className = 'form-status err';
        status.textContent = 'Connection problem — please try again.';
      });
  });
})();
</script>
</body>
</html>
