<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — GioAviation.aero</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <circle cx="15" cy="15" r="15" fill="#E3F1FA"/>
        <path d="M15 6L18 13.5L26 15L18 16.5L15 24L12 16.5L4 15L12 13.5L15 6Z" fill="#3E9FDB"/>
      </svg>
      <span class="name">GioAviation<b>.aero</b></span>
    </div>
    <nav class="primary"><a href="index.html">Home</a></nav>
  </div>
</header>

<main>
  <section class="cred-hero" style="padding-bottom:0;">
    <div class="wrap">
      <span class="eyebrow kicker">Admin</span>
      <h1>Access requests dashboard</h1>
    </div>
  </section>

  <section>
    <div class="wrap" style="max-width:400px;">
      <form id="admin-login-form" class="contact-form">
        <div class="field">
          <label for="password">Admin password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="align-self:flex-start;">Log in</button>
        <div id="form-status" class="form-status" role="status"></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="fine">© 2026 GioAviation.aero</span>
    <nav><a href="index.html">Home</a></nav>
  </div>
</footer>

<script>
(function(){
  var form = document.getElementById('admin-login-form');
  var status = document.getElementById('form-status');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    status.className = 'form-status';
    status.textContent = '';
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    })
      .then(function(res){ return res.json().then(function(data){ return {ok: res.ok, data: data}; }); })
      .then(function(result){
        if (result.ok && result.data.ok){
          window.location.href = 'admin.html';
        } else {
          status.className = 'form-status err';
          status.textContent = 'Incorrect password.';
        }
      })
      .catch(function(){
        status.className = 'form-status err';
        status.textContent = 'Connection problem — please try again.';
      });
  });
})();
</script>
</body>
</html>
