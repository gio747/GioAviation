<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource library — GioAviation.aero</title>
<meta name="description" content="747-400 mental maps and technical reference material for approved pilots.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/img/favicon-16.png" sizes="16x16">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<meta name="theme-color" content="#071A2E">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="GioAviation.aero — home">
      <img src="assets/img/logo-mark-dark.svg" alt="" width="40" height="40">
      <span class="name">GioAviation<b>.aero</b></span>
    </a>
    <nav class="primary">
      <a href="index.html">Home</a>
      <a href="risorse.html" aria-current="page">Resources</a>
      <a href="articoli.html">Articles</a>
      <a href="credenziali.html">Credentials</a>
      <a href="contatti.html">Contact</a>
      <a href="/api/logout">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section id="resources">
    <div class="wrap">
      <div class="section-head">
        <div><span class="eyebrow">Approved pilots</span><h2>Resource library</h2></div>
      </div>
      <div id="status" class="form-status" role="status"></div>
      <div id="categories"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="logo-fine">
      <a class="logo" href="index.html" aria-label="GioAviation.aero — home"><img src="assets/img/logo-mark-dark.svg" alt="" width="28" height="28"><span class="name">GioAviation<b>.aero</b></span></a>
      <span class="fine">© 2026 GioAviation.aero</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="risorse.html">Resources</a>
      <a href="articoli.html">Articles</a>
      <a href="credenziali.html">Credentials</a>
      <a href="contatti.html">Contact</a>
    </nav>
  </div>
</footer>

<script>
(function(){
  var status = document.getElementById('status');
  var container = document.getElementById('categories');

  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function formatBytes(n){
    if (!n) return '';
    if (n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/1024/1024).toFixed(1) + ' MB';
  }

  fetch('/api/documents')
    .then(function(res){
      if (res.status === 401){ window.location.href = 'login.html?next=' + encodeURIComponent(location.pathname); return null; }
      return res.json();
    })
    .then(function(data){
      if (!data) return;
      if (!data.ok){
        status.className = 'form-status err';
        status.textContent = 'Could not load the resource library.';
        status.style.display = 'block';
        return;
      }
      if (!data.documents.length){
        status.className = 'form-status';
        status.textContent = 'No documents published yet — check back soon.';
        status.style.display = 'block';
        return;
      }
      status.style.display = 'none';

      var groups = {};
      var order = [];
      data.documents.forEach(function(d){
        var key = d.category_name || 'Uncategorized';
        if (!groups[key]){ groups[key] = []; order.push(key); }
        groups[key].push(d);
      });

      container.innerHTML = order.map(function(name){
        var cards = groups[name].map(function(d){
          return '<div class="resource-card">' +
            '<div class="top"><span class="tag">' + esc(name) + '</span>' +
            (d.revision_label ? '<span class="status" style="background:var(--success);">' + esc(d.revision_label) + '</span>' : '') +
            '</div>' +
            '<div class="body">' +
              '<h3>' + esc(d.title) + '</h3>' +
              (d.description ? '<p>' + esc(d.description) + '</p>' : '') +
              '<span class="meta" style="font-size:0.8125rem; color:var(--grey);">' +
                (d.revision_date ? 'Revised ' + esc(d.revision_date) : '') +
                (d.file_size ? ' · ' + formatBytes(d.file_size) : '') +
              '</span>' +
              '<a class="btn ghost" href="/api/documents/download?id=' + d.id + '" style="margin-top:6px;">Download PDF</a>' +
            '</div>' +
          '</div>';
        }).join('');
        return '<div class="resource-category"><h3>' + esc(name) + '</h3><div class="resource-grid">' + cards + '</div></div>';
      }).join('');
    })
    .catch(function(){
      status.className = 'form-status err';
      status.textContent = 'Connection problem — please reload.';
      status.style.display = 'block';
    });
})();
</script>
</body>
</html>
