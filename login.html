<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — GioAviation.aero</title>
<meta name="description" content="Log in to the GioAviation.aero pilot resource library.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/img/favicon-16.png" sizes="16x16">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<meta name="theme-color" content="#071A2E">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="GioAviation.aero — home">
      <img src="assets/img/logo-mark-dark.svg" alt="" width="40" height="40">
      <span class="name">GioAviation<b>.aero</b></span>
    </a>
    <nav class="primary">
      <a href="index.html">Home</a>
      <a href="articoli.html">Articles</a>
      <a href="richiedi-accesso.html">Request access</a>
      <a href="login.html" aria-current="page" class="btn ghost" style="padding:9px 18px;">Log in</a>
    </nav>
  </div>
</header>

<main>
  <section class="cred-hero" style="padding-bottom:0;">
    <div class="wrap">
      <span class="eyebrow kicker">Approved pilots</span>
      <h1>Log in to the resource library.</h1>
    </div>
  </section>

  <section>
    <div class="wrap" style="max-width:440px;">
      <form id="login-form" class="contact-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="align-self:flex-start;">Log in</button>
        <div id="form-status" class="form-status" role="status"></div>
      </form>
      <p style="margin-top:20px; font-size:0.9375rem; color:var(--ink-soft);">No account yet? <a href="richiedi-accesso.html" style="color:var(--sky-strong); font-weight:600;">Request access</a>.</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="logo-fine">
      <a class="logo" href="index.html" aria-label="GioAviation.aero — home"><img src="assets/img/logo-mark-dark.svg" alt="" width="28" height="28"><span class="name">GioAviation<b>.aero</b></span></a>
      <span class="fine">© 2026 GioAviation.aero</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="articoli.html">Articles</a>
      <a href="richiedi-accesso.html">Request access</a>
      <a href="login.html">Log in</a>
    </nav>
  </div>
</footer>

<script>
(function(){
  var form = document.getElementById('login-form');
  var status = document.getElementById('form-status');
  function nextUrl(){
    var params = new URLSearchParams(window.location.search);
    var next = params.get('next');
    return (next && next.indexOf('/') === 0) ? next : 'risorse.html';
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    status.className = 'form-status';
    status.textContent = '';
    var payload = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    };
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(res){ return res.json().then(function(data){ return {ok: res.ok, data: data}; }); })
      .then(function(result){
        if (result.ok && result.data.ok){
          window.location.href = nextUrl();
        } else {
          status.className = 'form-status err';
          status.textContent = 'Incorrect email or password, or access not yet approved.';
        }
      })
      .catch(function(){
        status.className = 'form-status err';
        status.textContent = 'Connection problem — please try again in a moment.';
      });
  });
})();
</script>
</body>
</html>
